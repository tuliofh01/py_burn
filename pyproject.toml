[tool.poetry]
name = "py_burn"
version = "1.0.1"
description = "CLI USB tool for Linux — format storage and burn bootable ISO images."
authors = ["tuliofh01 <tuliofh01@proton.me>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "py_burn" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware",
    "Topic :: System :: Installation/Setup",
]

[tool.poetry.urls]
Homepage = "https://github.com/tuliofh01/py_burn"
Repository = "https://github.com/tuliofh01/py_burn"

[tool.poetry.scripts]
pyburn = "py_burn.__main__:main"
py_burn = "py_burn.__main__:main"

[tool.poetry.dependencies]
python = "^3.14"
tinydb = "^4.8"
rich = "^14.0"
pyfiglet = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
ruff = "^0.4"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"