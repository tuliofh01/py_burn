[tool.poetry]
name = "shuffus"
version = "1.0.1"
description = "Create bootable Windows USB drives from Linux with a friendly GUI — no command line required."
authors = ["tuliofh01 <tuliofh01@proton.me>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "shuffus", from = "src" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware",
    "Topic :: System :: Installation/Setup",
]

[tool.poetry.urls]
Homepage = "https://github.com/tuliofh01/shuffus"
Repository = "https://github.com/tuliofh01/shuffus"

[tool.poetry.scripts]
shuffus = "shuffus.__main__:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"